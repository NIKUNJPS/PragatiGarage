<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="WrenchBook - Garage Management Software">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dbe6fb"/>
      <stop offset="0.55" stop-color="#8fa3d9"/>
      <stop offset="1" stop-color="#c9d6f0"/>
    </linearGradient>
  </defs>

  <!-- dark navy rounded background -->
  <rect width="480" height="480" rx="60" fill="#0a0e1a"/>

  <!-- wrench mark (outline, matches the app's favicon glyph) -->
  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
        fill="none" stroke="url(#metal)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"
        transform="translate(168 70) scale(6)"/>

  <!-- WRENCH -->
  <text x="240" y="292" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-style="italic" font-size="80" letter-spacing="-2"
        fill="url(#metal)">WRENCH</text>

  <!-- blue accent dashes -->
  <g fill="#2f6fed">
    <rect x="70" y="326" width="60" height="9" rx="4.5"/>
    <rect x="86" y="342" width="44" height="8" rx="4"/>
    <rect x="350" y="326" width="60" height="9" rx="4.5"/>
    <rect x="350" y="342" width="44" height="8" rx="4"/>
  </g>

  <!-- BOOK -->
  <text x="240" y="350" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-style="italic" font-size="52" letter-spacing="2"
        fill="#2f6fed">BOOK</text>

  <!-- GARAGE MANAGEMENT SOFTWARE -->
  <g>
    <rect x="60" y="388" width="34" height="4" rx="2" fill="#2f6fed"/>
    <rect x="386" y="388" width="34" height="4" rx="2" fill="#2f6fed"/>
    <text x="240" y="396" text-anchor="middle" font-family="Arial, sans-serif"
          font-weight="700" font-size="19" letter-spacing="3.5"
          fill="url(#metal)">GARAGE MANAGEMENT SOFTWARE</text>
  </g>
</svg>
